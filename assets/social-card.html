<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- Source for social-card.png (the link preview image). Rendered at 1200x630,
     device pixel ratio 2, by reef-metrics-ops/scripts/render-social-card.mjs. -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #000; }
  body { font-family: "Poppins", system-ui, sans-serif; color: #f4f6f7; position: relative; }
  .render { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .copy { position: absolute; left: 72px; top: 50%; translate: 0 -50%; width: 520px; }
  .logo { height: 78px; width: auto; display: block; margin-bottom: 44px; }
  h1 { font-size: 54px; font-weight: 500; line-height: 1.06; letter-spacing: -0.035em; }
  p { margin-top: 22px; font-size: 21px; font-weight: 300; line-height: 1.5; color: #a9b2b7; }
  .offer { margin-top: 36px; display: inline-block; padding: 12px 24px; border-radius: 999px; background: #f4f6f7; color: #000; font-size: 18px; font-weight: 500; }
</style>
</head>
<body>
  <img class="render" src="img/social.webp" alt="" />
  <div class="copy">
    <img class="logo" src="brand/logo-stacked.svg" alt="ReefMetrics" />
    <h1>The most compact and powerful reef system ever made.</h1>
    <p>Ten parameters, tested automatically. Open hardware.</p>
    <span class="offer">Beta Kit pre-orders open</span>
  </div>
</body>
</html>
